<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop All Fragrances — D'Vaaw</title>
<meta name="description" content="Browse the full D'Vaaw collection — For Her, For Him, Unisex, and the Borneo Edition.">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="experience.css">
<style>
.shop-filters {
    position: sticky;
    top: 64px;
    z-index: 40;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    padding: 1.2rem var(--pad-x);
    flex-wrap: wrap;
}
.filter-btn {
    padding: 0.6rem 1.4rem;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    border-radius: 2rem;
    transition: all 0.25s;
}
.filter-btn:hover { color: var(--text); }
.filter-btn.active { background: var(--black); color: #fff; }

.shop-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(1rem, 2vw, 1.8rem);
    padding: clamp(2.5rem, 5vw, 4rem) var(--pad-x);
    min-height: 50vh;
}
.prod-card {
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 1.6rem;
    display: flex;
    flex-direction: column;
    text-align: center;
    transition: border-color 0.3s, transform 0.3s var(--ease), box-shadow 0.3s;
}
.prod-card:hover { border-color: var(--gold); transform: translateY(-5px); box-shadow: 0 20px 50px rgba(0,0,0,0.07); }
.pc-img { aspect-ratio: 3/4; display: flex; align-items: center; justify-content: center; margin-bottom: 1.2rem; overflow: hidden; }
.pc-img img { max-height: 100%; object-fit: contain; transition: transform 0.5s var(--ease); }
.prod-card:hover .pc-img img { transform: scale(1.05); }
.pc-img .ph { width: 100%; height: 100%; background: var(--mist); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-style: italic; color: var(--muted); padding: 1rem; text-align: center; }
.pc-cat { font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.5rem; }
.pc-name { font-family: var(--display); font-size: 1.3rem; margin-bottom: 0.4rem; }
.pc-notes { font-size: 0.72rem; color: var(--muted); margin-bottom: 1rem; min-height: 2rem; }
.pc-details { margin: 0 1.3rem 1.1rem; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.pc-details summary { padding: 0.75rem 0; cursor: pointer; list-style: none; font-size: 0.65rem; font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; color: var(--gold); }
.pc-details summary::-webkit-details-marker { display: none; }
.pc-details summary::after { content: '+'; float: right; font-size: 1rem; line-height: 0.8; color: var(--text); }
.pc-details[open] summary::after { content: '−'; }
.pc-details p { font-size: 0.74rem; color: var(--muted); line-height: 1.7; padding-bottom: 0.8rem; }
.pc-profile { display: grid; gap: 0.35rem; padding-bottom: 0.9rem; }
.pc-profile div { display: grid; grid-template-columns: 4.25rem 1fr; gap: 0.5rem; font-size: 0.7rem; }
.pc-profile dt { color: var(--gold); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
.pc-profile dd { color: var(--text); }
.pc-price { font-size: 0.85rem; font-weight: 500; margin-bottom: 1.1rem; }
.pc-actions { margin-top: auto; display: flex; flex-direction: column; gap: 0.6rem; }
.pc-size { display: flex; gap: 0.4rem; }
.pc-size button { flex: 1; padding: 0.55rem; font-size: 0.68rem; letter-spacing: 0.08em; border: 1px solid var(--line); transition: all 0.2s; color: var(--text); }
.pc-size button.sel { background: var(--black); color: #fff; border-color: var(--black); }
.pc-add { width: 100%; padding: 0.8rem; background: var(--black); color: #fff; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; transition: background 0.25s; }
.pc-add:hover { background: var(--gold); color: var(--black); }
.pc-card-hidden { display: none; }

.recently { background: var(--mist); padding: clamp(2.5rem,5vw,4rem) var(--pad-x); }
.recently h3 { text-align: center; font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 2rem; font-family: var(--body); font-weight: 500; }
.recently-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1rem; max-width: 1100px; margin: 0 auto; }
.rv-mini { background: #fff; border: 1px solid var(--line); padding: 1rem; text-align: center; transition: border-color 0.3s, transform 0.3s; cursor: pointer; }
.rv-mini:hover { border-color: var(--gold); transform: translateY(-3px); }
.rv-mini img { aspect-ratio: 3/4; object-fit: contain; width: 100%; margin-bottom: 0.6rem; }
.rv-mini .ph { aspect-ratio: 3/4; background: var(--mist); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-style: italic; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.6rem; }
.rv-mini .n { font-size: 0.7rem; font-weight: 500; }

@media (max-width: 900px) {
    .shop-grid { grid-template-columns: repeat(2, 1fr); }
    .shop-filters { top: 56px; }
    .recently-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 540px) {
    .shop-grid { grid-template-columns: 1fr 1fr; gap: 0.8rem; }
    .prod-card { padding: 1rem; }
    .pc-name { font-size: 1.1rem; }
    .recently-grid { grid-template-columns: repeat(2, 1fr); }
}

/* Editorial collection layout */
.shop-filters {
    top: 62px;
    background: rgba(242,236,221,0.95);
    padding-block: 1rem;
}
.filter-btn { border: 1px solid transparent; }
.filter-btn:hover { border-color: var(--line); }
.filter-btn.active {
    background: var(--ink);
    color: var(--paper) !important;
    -webkit-text-fill-color: var(--paper);
    font-weight: 600;
}
.shop-grid { max-width: 1600px; margin: 0 auto; align-items: start; }
.prod-card { border: 0; background: var(--cream); padding: 0 0 1.5rem; text-align: left; box-shadow: 0 14px 40px rgba(0,0,0,0.055); }
.prod-card:nth-child(4n + 2), .prod-card:nth-child(4n + 4) { margin-top: 2.25rem; }
.pc-img { background: var(--soft-sand); margin: 0 0 1.3rem; cursor: pointer; }
.pc-img img { display: block; width: 100%; height: 100%; max-height: none; object-fit: cover; object-position: center center; }
.pc-cat, .pc-name, .pc-notes, .pc-price, .pc-actions { margin-left: 1.3rem; margin-right: 1.3rem; }
.pc-size button, .pc-add { border-radius: 999px; }
.recently { background: var(--mist); }
.rv-mini { background: var(--cream); border: 0; }
.rv-mini img { object-fit: cover; }
.collection-tools { max-width: 1600px; margin: 0 auto; padding: 2rem var(--pad-x) 0; }
.collection-controls { display: flex; align-items: end; gap: 1rem; }
.collection-search { flex: 1; }
.collection-tools label { display: block; font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 0.55rem; color: var(--muted); }
.collection-search input, .collection-sort select { width: 100%; min-height: 48px; border: 1px solid var(--line); background: var(--cream); padding: 0.8rem 1rem; border-radius: 6px; color: var(--text); font: inherit; font-size: 0.85rem; }
.collection-search input:focus, .collection-sort select:focus { outline: 2px solid var(--gold); outline-offset: 3px; }
.collection-sort { min-width: 190px; }
.saved-filter { min-height: 48px; border: 1px solid var(--line); padding: 0.75rem 1rem; border-radius: 6px; font-size: 0.78rem; white-space: nowrap; }
.saved-filter[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.collection-status { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 1rem; min-height: 2rem; color: var(--muted); font-size: 0.78rem; }
.collection-reset { text-decoration: underline; text-underline-offset: 4px; }
.shop-grid { padding-top: 1.5rem; }
.pc-visual { position: relative; }
button.pc-img { display: block; width: 100%; padding: 0; text-align: inherit; }
.pc-quick-label { position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%); padding: 0.6rem 1rem; border-radius: 999px; background: var(--paper); color: var(--ink); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; box-shadow: 0 4px 16px #0001; }
.pc-save { position: absolute; top: 0.75rem; right: 0.75rem; width: 40px; height: 40px; border-radius: 50%; background: var(--paper); color: var(--ink); display: grid; place-items: center; border: 1px solid var(--line); box-shadow: 0 4px 12px #0001; }
.pc-save svg { width: 18px; height: 18px; fill: currentColor; opacity: .45; }
.pc-save[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.pc-save[aria-pressed="true"] svg { opacity: 1; }
.pc-name button { text-align: left; font: inherit; color: inherit; }
.pc-img:focus-visible, .pc-save:focus-visible, .pc-name button:focus-visible, .saved-filter:focus-visible, .collection-reset:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
.collection-empty { grid-column: 1 / -1; text-align: center; padding: 4rem 1rem; }
.collection-empty h2 { font-family: var(--display); font-weight: 400; font-size: clamp(2rem, 5vw, 3rem); margin-bottom: 1rem; }
.collection-empty p { color: var(--muted); max-width: 40ch; margin: 0 auto 1.5rem; }
.rv-mini { width: 100%; color: inherit; }
@media (max-width: 900px) {
    .prod-card:nth-child(4n + 2), .prod-card:nth-child(4n + 4) { margin-top: 0; }
    .prod-card:nth-child(even) { margin-top: 1.5rem; }
}
@media (max-width: 540px) {
    .collection-tools { padding: 1.5rem 1rem 0; }
    .collection-controls { flex-wrap: wrap; gap: 0.8rem; }
    .collection-search { flex-basis: 100%; }
    .collection-sort { flex: 1; min-width: 0; }
    .saved-filter { flex: 1; }
    .shop-grid { padding-left: 1rem; padding-right: 1rem; }
    .pc-cat, .pc-name, .pc-notes, .pc-price, .pc-actions { margin-left: 0.9rem; margin-right: 0.9rem; }
    .pc-details { margin-left: 0.9rem; margin-right: 0.9rem; }
}
</style>
</head>
<body>

<section class="page-intro">
    <span class="eyebrow" id="collectionCount">33 Fragrances</span>
    <h1>The Collection</h1>
    <p>Every scent is Halal-certified, crafted with Gula Apong, and made to last. Available in 10ml and 35ml.</p>
    <button type="button" class="btn btn-gold" data-open-finder style="margin-top:1.5rem">Find my signature scent <span aria-hidden="true">↗</span></button>
</section>

<div class="shop-filters" id="filters" role="group" aria-label="Fragrance collection">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="her">For Her</button>
    <button class="filter-btn" data-filter="him">For Him</button>
    <button class="filter-btn" data-filter="unisex">Unisex</button>
    <button class="filter-btn" data-filter="borneo">Borneo Edition</button>
</div>

<section class="collection-tools" aria-label="Find a fragrance">
    <div class="collection-controls">
        <div class="collection-search">
            <label for="scentSearch">A name, a note, a feeling</label>
            <input id="scentSearch" type="search" placeholder="Try vanilla, rose or Dark Alpha…" autocomplete="off" maxlength="120" aria-controls="grid">
        </div>
        <div class="collection-sort">
            <label for="scentSort">Sort collection</label>
            <select id="scentSort" aria-controls="grid">
                <option value="featured">House order</option>
                <option value="az">Name: A–Z</option>
                <option value="za">Name: Z–A</option>
            </select>
        </div>
        <button type="button" class="saved-filter" id="savedFilter" aria-pressed="false" aria-controls="grid"><span data-icon="heart"></span> Saved scents <span id="savedCount">0</span></button>
    </div>
    <div class="collection-status">
        <p id="resultCount" role="status" aria-live="polite" aria-atomic="true"></p>
        <button type="button" class="collection-reset" id="resetFilters" hidden>Reset filters</button>
    </div>
</section>

<div class="shop-grid" id="grid" aria-label="Fragrances"></div>

<section class="recently" id="recently" style="display:none;">
    <h3>Recently Viewed</h3>
    <div class="recently-grid" id="recentlyGrid"></div>
</section>

<script src="app.js?v=bd2ff2e"></script>
<script src="experience.js"></script>
<script src="shop.js"></script>
</body>
</html>
